<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Leo Liang | Contact</title>
  <meta name="description" content="Contact page with client-side validation.">
  <link rel="stylesheet" href="css/styles.css">
  <script src="js/main.js" defer></script>
</head>
<body>
  <header class="site-header">
    <div class="wrapper header-inner">
      <a class="brand" href="index.html#about">
        <h1>Leo Liang</h1>
      </a>

      <nav class="nav" aria-label="Primary">
        <a href="index.html#about">About</a>
        <a href="index.html#projects">Projects</a>
        <a href="index.html#music">Music</a>
        <a href="contact.html">Contact</a>
      </nav>
    </div>
  </header>

  <main class="wrapper">
    <section>
      <h3>Contact</h3>
      <!-- <p class="tagline">Front-end only: validates fields and shows a local confirmation message.</p> -->

      <form id="contactForm" class="form" novalidate>
        <label>
          Name
          <input id="name" name="name" autocomplete="name" required>
          <span class="field-error" aria-live="polite"></span>
        </label>

        <label>
          Email
          <input id="email" name="email" type="email" autocomplete="email" required>
          <span class="field-error" aria-live="polite"></span>
        </label>

        <label>
          Message
          <textarea id="message" name="message" required></textarea>
          <span class="field-error" aria-live="polite"></span>
        </label>

        <button class="button small" type="submit">Send</button>
        <p id="formStatus" style="color:var(--muted);margin:0" aria-live="polite"></p>
      </form>
      <div class="social" aria-label="Social links">
          <a href="contact.html"><img src="images/emailicon.png" alt="Email" class="icon"></a>
          <a href="https://github.com/lleoliang"><img src="images/githubicon.png" alt="GitHub" class="icon"></a>
          <a href="https://www.linkedin.com/in/ileoliang"><img src="images/linkedinicon.png" alt="LinkedIn" class="icon"></a>
      </div>
    </section>
  </main>

  <button id="backToTop" class="button back-to-top small" type="button" aria-label="Back to top">Top</button>

  <footer class="site-footer">
    <div class="wrapper footer-row">
      <div>© <span id="year"></span> Leo Liang</div>
      <div><a href="index.html">leo-liang</a></div>
    </div>
  </footer>
</body>
</html>
